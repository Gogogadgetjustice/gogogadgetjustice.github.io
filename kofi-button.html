<!-- Ko-fi Button Include
Add this to the <head> of any HTML file to include a small Ko-fi donation button.
Replace 'YOUR_USERNAME' with your actual Ko-fi username.
-->

<style>
.kofi-button {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 9999;
}

.kofi-button a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    text-decoration: none;
    padding: 8px 14px;
    border-radius: 50px;
    font-size: 0.85rem;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    font-family: inherit;
}

.kofi-button a:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(102, 126, 234, 0.6);
}

.kofi-button a:active {
    transform: translateY(0);
}

.kofi-icon {
    width: 16px;
    height: 16px;
    display: inline-block;
}

/* Mobile adjustments */
@media (max-width: 480px) {
    .kofi-button {
        bottom: 15px;
        right: 15px;
    }
    
    .kofi-button a {
        padding: 6px 10px;
        font-size: 0.75rem;
    }
    
    .kofi-icon {
        width: 14px;
        height: 14px;
    }
}
</style>

<div class="kofi-button">
    <a href="https://ko-fi.com/gogogadgetjustice" target="_blank" rel="noopener noreferrer" title="Support on Ko-fi">
