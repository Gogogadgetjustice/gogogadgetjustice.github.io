<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Piano Looper Rack</title>
    <!-- Tone.js for professional audio, effects, and timing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root {
            --bg: #121212;
            --panel: #1e1e1e;
            --text: #f0f0f0;
            --accent: #4da6ff;
            --rec: #ff4d4d;
            --play: #4dff88;
            --border: #333;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 { font-size: 1.5rem; margin-bottom: 10px; text-align: center;}
        p.sub { color: #aaa; margin-top: 0; font-size: 0.9rem; text-align: center;}

        /* Large, accessible buttons */
        button {
            background: var(--panel);
            color: var(--text);
            border: 2px solid var(--border);
            padding: 15px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            min-width: 100px;
            min-height: 50px;
            transition: all 0.2s;
        }
        button:hover, button:focus {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
            background: #2a2a2a;
        }
        button:active { transform: scale(0.98); }

        /* State colors for Looper */
        .btn-rec { border-color: var(--rec); color: var(--rec); }
        .btn-rec.active { background: var(--rec); color: white; animation: pulse 1s infinite; }
        .btn-play { border-color: var(--play); color: var(--play); }
        .btn-play.active { background: var(--play); color: black; }

        @keyframes pulse {
            0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; }
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
        }

        .panel-title {
            margin-top: 0;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            font-size: 1.1rem;
            color: var(--accent);
        }

        /* Grid layouts for controls */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        
        @media (max-width: 600px) {
            .grid-2, .grid-4 { grid-template-columns: 1fr 1fr; }
        }

        /* Sliders */
        label { display: flex; flex-direction: column; font-size: 0.9rem; color: #ccc; gap: 5px;}
        input[type="range"] {
            width: 100%;
            height: 30px; /* Large touch target */
            background: transparent;
            accent-color: var(--accent);
        }

        /* Virtual Piano Keyboard */
        .keyboard {
            display: flex;
            position: relative;
            height: 180px;
            width: 100%;
            margin-top: 10px;
            user-select: none;
        }
        .key {
            flex: 1;
            border: 1px solid #000;
            border-radius: 0 0 6px 6px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 10px;
            font-size: 0.8rem;
            color: #555;
            cursor: pointer;
            transition: background 0.1s;
        }
        .key.white { background: #f0f0f0; color: #333; z-index: 1;}
        .key.white.active { background: #d0e8ff; }
        
        .key.black {
            position: absolute;
            width: 6%;
            height: 60%;
            background: #222;
            color: #aaa;
            z-index: 2;
            border-radius: 0 0 4px 4px;
            border: 1px solid #000;
        }
        .key.black.active { background: #444; }

        /* Start Audio Overlay */
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100;
        }
        #start-overlay.hidden { display: none; }
        #start-btn { font-size: 1.5rem; padding: 25px 40px; background: var(--accent); color: black; border: none;}
    </style>
</head>
<body>

    <!-- Mandatory Start Overlay for Browser Audio Policies -->
    <div id="start-overlay">
        <h1>WebAudio Modular Rack</h1>
        <p>Browsers require a click to start audio.</p>
        <button id="start-btn" aria-label="Start Audio Engine">START AUDIO ENGINE</button>
    </div>

    <h1>Accessible Piano & Looper Rack</h1>
    <p class="sub">Use your computer keyboard (A-L) or click/tap the keys. Tap REC to record, tap again to stop & loop.</p>

    <!-- INSTRUMENTS -->
    <div class="panel">
        <h2 class="panel-title">1. Instruments</h2>
        <div class="grid-4">
            <button id="inst-piano" class="active" style="background: var(--accent); color: black;" aria-pressed="true">FM Electric Piano</button>
            <button id="inst-sine" aria-pressed="false">Sine (Clean)</button>
            <button id="inst-square" aria-pressed="false">Square (8-Bit)</button>
            <button id="inst-saw" aria-pressed="false">Sawtooth (Sharp)</button>
        </div>
    </div>

    <!-- FX RACK -->
    <div class="panel">
        <h2 class="panel-title">2. Global FX & Mix</h2>
        <div class="grid-2">
            <label>Reverb Mix
                <input type="range" id="fx-reverb" min="0" max="1" step="0.01" value="0.3" aria-label="Reverb Mix">
            </label>
            <label>Reverb Size (Decay)
                <input type="range" id="fx-reverb-decay" min="0.1" max="10" step="0.1" value="3" aria-label="Reverb Decay">
            </label>
            <label>Delay Mix
                <input type="range" id="fx-delay" min="0" max="1" step="0.01" value="0.15" aria-label="Delay Mix">
            </label>
            <label>Chorus Mix
                <input type="range" id="fx-chorus" min="0" max="1" step="0.01" value="0.2" aria-label="Chorus Mix">
            </label>
        </div>
    </div>

    <!-- LOOP STATION -->
    <div class="panel">
        <h2 class="panel-title">3. Loop Station (4-Track)</h2>
        <div class="grid-4" id="loop-tracks">
            <!-- Track 1 -->
            <div style="display:flex; flex-direction:column; gap:10px;">
                <button class="btn-rec" data-track="0" aria-label="Record Track 1">REC 1</button>
                <button class="btn-play" data-track="0" aria-label="Play Track 1" disabled>PLAY 1</button>
                <button data-track="0" data-action="clear" aria-label="Clear Track 1">CLEAR</button>
            </div>
            <!-- Track 2 -->
            <div style="display:flex; flex-direction:column; gap:10px;">
                <button class="btn-rec" data-track="1" aria-label="Record Track 2">REC 2</button>
                <button class="btn-play" data-track="1" aria-label="Play Track 2" disabled>PLAY 2</button>
                <button data-track="1" data-action="clear" aria-label="Clear Track 2">CLEAR</button>
            </div>
            <!-- Track 3 -->
            <div style="display:flex; flex-direction:column; gap:10px;">
                <button class="btn-rec" data-track="2" aria-label="Record Track 3">REC 3</button>
                <button class="btn-play" data-track="2" aria-label="Play Track 3" disabled>PLAY 3</button>
                <button data-track="2" data-action="clear" aria-label="Clear Track 3">CLEAR</button>
            </div>
            <!-- Track 4 -->
            <div style="display:flex; flex-direction:column; gap:10px;">
                <button class="btn-rec" data-track="3" aria-label="Record Track 4">REC 4</button>
                <button class="btn-play" data-track="3" aria-label="Play Track 4" disabled>PLAY 4</button>
                <button data-track="3" data-action="clear" aria-label="Clear Track 4">CLEAR</button>
            </div>
        </div>
        <button id="stop-all" style="width: 100%; margin-top: 15px; background: #333;">STOP ALL & CLEAR LOOPS</button>
    </div>

    <!-- KEYBOARD -->
    <div class="panel">
        <h2 class="panel-title">4. Virtual Keys</h2>
        <div class="keyboard" id="keyboard" role="application" aria-label="Piano Keyboard"></div>
    </div>

    <script>
        // ==========================================
        // 1. AUDIO ENGINE & ROUTING
        // ==========================================
        let audioStarted = false;
        
        // Master FX Chain
        const chorus = new Tone.Chorus({ frequency: 1.5, delayTime: 3.5, wet: 0.2 }).start();
        const reverb = new Tone.Reverb({ decay: 3, wet: 0.3 });
        const delay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.3, wet: 0.15 });
        const masterGain = new Tone.Gain(0.8);

        // Chain: Chorus -> Reverb -> Delay -> Master -> Speakers
        chorus.connect(reverb);
        reverb.connect(delay);
        delay.connect(masterGain);
        masterGain.toDestination();

        // Recording Bus (Captures ONLY live playing, not loop playback)
        const liveBus = new Tone.Gain();
        const recDest = Tone.getContext().createMediaStreamDestination();
        liveBus.connect(recDest);
        
        // Live audio also goes to the FX chain
        liveBus.connect(chorus);

        // ==========================================
        // 2. INSTRUMENTS
        // ==========================================
        // FM Synth configured to sound like a warm Electric Piano (Rhodes/Wurlitzer)
        const fmPiano = new Tone.FMSynth({
            harmonicity: 3,
            modulationIndex: 10,
            envelope: { attack: 0.001, decay: 1.5, sustain: 0.2, release: 0.5 },
            modulation: { type: "sine" },
            modulationEnvelope: { attack: 0.002, decay: 1.0, sustain: 0.5, release: 0.2 }
        }).connect(liveBus);

        // Basic PolySynth for the other waveforms
        const basicSynth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "sine" },
            envelope: { attack: 0.005, decay: 0.3, sustain: 0.4, release: 1.0 }
        }).connect(liveBus);

        let activeInstrument = fmPiano;

        // ==========================================
        // 3. LOOP STATION LOGIC
        // ==========================================
        const tracks = [
            { buffer: null, player: null, isRecording: false, isPlaying: false },
            { buffer: null, player: null, isRecording: false, isPlaying: false },
            { buffer: null, player: null, isRecording: false, isPlaying: false },
            { buffer: null, player: null, isRecording: false, isPlaying: false }
        ];
        
        let mediaRecorder = null;
        let recordingChunks = [];
        let currentRecordingTrack = -1;

        function startRecording(trackIndex) {
            // Stop any other recording first
            if (currentRecordingTrack !== -1) stopRecording();

            currentRecordingTrack = trackIndex;
            tracks[trackIndex].isRecording = true;
            recordingChunks = [];

            mediaRecorder = new MediaRecorder(recDest.stream);
            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordingChunks.push(e.data);
            };

            mediaRecorder.onstop = async () => {
                const blob = new Blob(recordingChunks, { type: 'audio/webm' });
                const arrayBuffer = await blob.arrayBuffer();
                
                // Decode audio using Tone.js context
                const audioBuffer = await Tone.getContext().decodeAudioData(arrayBuffer);
                tracks[trackIndex].buffer = audioBuffer;
                tracks[trackIndex].isRecording = false;
                currentRecordingTrack = -1;
                updateLooperUI();
            };

            mediaRecorder.start();
            updateLooperUI();
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        }

        function playTrack(trackIndex) {
            if (!tracks[trackIndex].buffer) return;

            // Stop if already playing
            if (tracks[trackIndex].player) {
                tracks[trackIndex].player.stop();
                tracks[trackIndex].player.dispose();
            }

            // Create player and route to FX chain (NOT liveBus, so it doesn't re-record)
            const player = new Tone.Player(tracks[trackIndex].buffer).connect(chorus);
            player.loop = true;
            player.loopStart = 0;
            player.start();
            
            tracks[trackIndex].player = player;
            tracks[trackIndex].isPlaying = true;
            updateLooperUI();
        }

        function stopTrack(trackIndex) {
            if (tracks[trackIndex].player) {
                tracks[trackIndex].player.stop();
                tracks[trackIndex].player.dispose();
                tracks[trackIndex].player = null;
            }
            tracks[trackIndex].isPlaying = false;
            updateLooperUI();
        }

        function clearTrack(trackIndex) {
            stopTrack(trackIndex);
            tracks[trackIndex].buffer = null;
            updateLooperUI();
        }

        function updateLooperUI() {
            document.querySelectorAll('#loop-tracks > div').forEach((trackEl, index) => {
                const recBtn = trackEl.querySelector('.btn-rec');
                const playBtn = trackEl.querySelector('.btn-play');
                const track = tracks[index];

                // Reset classes
                recBtn.classList.remove('active');
                playBtn.classList.remove('active');
                playBtn.disabled = true;

                if (track.isRecording) {
                    recBtn.classList.add('active');
                    recBtn.innerText = `STOP REC ${index + 1}`;
                } else if (track.buffer) {
                    recBtn.innerText = `REC ${index + 1}`;
                    playBtn.disabled = false;
                    
                    if (track.isPlaying) {
                        playBtn.classList.add('active');
                        playBtn.innerText = `PAUSE ${index + 1}`;
                    } else {
                        playBtn.innerText = `PLAY ${index + 1}`;
                    }
                } else {
                    recBtn.innerText = `REC ${index + 1}`;
                    playBtn.innerText = `PLAY ${index + 1}`;
                }
            });
        }

        // ==========================================
        // 4. UI & KEYBOARD MAPPING
        // ==========================================
        
        // Start Audio Engine
        document.getElementById('start-btn').addEventListener('click', async () => {
            await Tone.start();
            document.getElementById('start-overlay').classList.add('hidden');
            audioStarted = true;
        });

        // Instrument Selection
        const instBtns = {
            'inst-piano': fmPiano,
            'inst-sine': basicSynth,
            'inst-square': basicSynth,
            'inst-saw': basicSynth
        };

        Object.keys(instBtns).forEach(id => {
            document.getElementById(id).addEventListener('click', (e) => {
                document.querySelectorAll('[id^="inst-"]').forEach(btn => {
                    btn.style.background = '';
                    btn.style.color = '';
                    btn.setAttribute('aria-pressed', 'false');
                });
                e.target.style.background = 'var(--accent)';
                e.target.style.color = 'black';
                e.target.setAttribute('aria-pressed', 'true');

                if (id === 'inst-piano') {
                    activeInstrument = fmPiano;
                } else {
                    activeInstrument = basicSynth;
                    const wave = id.split('-')[1];
                    basicSynth.set({ oscillator: { type: wave } });
                }
            });
        });

        // FX Sliders
        document.getElementById('fx-reverb').addEventListener('input', (e) => reverb.wet.value = e.target.value);
        document.getElementById('fx-reverb-decay').addEventListener('input', (e) => reverb.decay = e.target.value);
        document.getElementById('fx-delay').addEventListener('input', (e) => delay.wet.value = e.target.value);
        document.getElementById('fx-chorus').addEventListener('input', (e) => chorus.wet.value = e.target.value);

        // Looper Buttons
        document.querySelectorAll('#loop-tracks button').forEach(btn => {
            btn.addEventListener('click', () => {
                if (!audioStarted) return;
                const trackIndex = parseInt(btn.dataset.track);
                const action = btn.dataset.action;

                if (btn.classList.contains('btn-rec')) {
                    if (tracks[trackIndex].isRecording) stopRecording();
                    else startRecording(trackIndex);
                } else if (btn.classList.contains('btn-play')) {
                    if (tracks[trackIndex].isPlaying) stopTrack(trackIndex);
                    else playTrack(trackIndex);
                } else if (action === 'clear') {
                    clearTrack(trackIndex);
                }
            });
        });

        document.getElementById('stop-all').addEventListener('click', () => {
            if (currentRecordingTrack !== -1) stopRecording();
            for (let i = 0; i < 4; i++) clearTrack(i);
        });

        // Build Virtual Keyboard
        const keyboardEl = document.getElementById('keyboard');
        const notes = [
            { note: 'C4', type: 'white', key: 'a' }, { note: 'C#4', type: 'black', key: 'w' },
            { note: 'D4', type: 'white', key: 's' }, { note: 'D#4', type: 'black', key: 'e' },
            { note: 'E4', type: 'white', key: 'd' }, { note: 'F4', type: 'white', key: 'f' },
            { note: 'F#4', type: 'black', key: 't' }, { note: 'G4', type: 'white', key: 'g' },
            { note: 'G#4', type: 'black', key: 'y' }, { note: 'A4', type: 'white', key: 'h' },
            { note: 'A#4', type: 'black', key: 'u' }, { note: 'B4', type: 'white', key: 'j' },
            { note: 'C5', type: 'white', key: 'k' }, { note: 'C#5', type: 'black', key: 'o' },
            { note: 'D5', type: 'white', key: 'l' }
        ];

        let blackKeyOffset = 0;
        const whiteKeyWidth = 100 / notes.filter(n => n.type === 'white').length;

        notes.forEach((n, i) => {
            const keyEl = document.createElement('div');
            keyEl.className = `key ${n.type}`;
            keyEl.dataset.note = n.note;
            keyEl.innerHTML = `<span>${n.key.toUpperCase()}</span>`;
            
            if (n.type === 'white') {
                keyEl.style.flex = '1';
            } else {
                // Position black keys
                keyEl.style.left = `${(blackKeyOffset * whiteKeyWidth) + (whiteKeyWidth * 0.65)}%`;
                blackKeyOffset++;
            }
            if (n.type === 'white') blackKeyOffset++; // Wait, logic fix for black keys positioning
            // Simplified black key positioning:
            if(n.type === 'black') {
                // Find previous white key index
                let prevWhiteCount = notes.slice(0, i).filter(x => x.type === 'white').length;
                keyEl.style.left = `${(prevWhiteCount * whiteKeyWidth) - (whiteKeyWidth * 0.15)}%`;
            }

            // Mouse/Touch events
            const startNote = (e) => {
                e.preventDefault();
                if (!audioStarted) return;
                keyEl.classList.add('active');
                activeInstrument.triggerAttack(n.note, Tone.now());
            };
            const endNote = (e) => {
                e.preventDefault();
                keyEl.classList.remove('active');
                activeInstrument.triggerRelease(n.note, Tone.now());
            };

            keyEl.addEventListener('mousedown', startNote);
            keyEl.addEventListener('mouseup', endNote);
            keyEl.addEventListener('mouseleave', endNote);
            keyEl.addEventListener('touchstart', startNote, { passive: false });
            keyEl.addEventListener('touchend', endNote, { passive: false });

            keyboardEl.appendChild(keyEl);
        });

        // Computer Keyboard Mapping
        const keyMap = {};
        notes.forEach(n => keyMap[n.key] = n.note);
        const pressedKeys = new Set();

        document.addEventListener('keydown', (e) => {
            if (!audioStarted || pressedKeys.has(e.key)) return;
            const note = keyMap[e.key.toLowerCase()];
            if (note) {
                pressedKeys.add(e.key);
                document.querySelector(`.key[data-note="${note}"]`)?.classList.add('active');
                activeInstrument.triggerAttack(note, Tone.now());
            }
        });

        document.addEventListener('keyup', (e) => {
            const note = keyMap[e.key.toLowerCase()];
            if (note) {
                pressedKeys.delete(e.key);
                document.querySelector(`.key[data-note="${note}"]`)?.classList.remove('active');
                activeInstrument.triggerRelease(note, Tone.now());
            }
        });

    </script>
</body>
</html>
